name = "kartar-places-proxy"
main = "src/index.js"
compatibility_date = "2026-01-01"

[vars]
FIREBASE_PROJECT_ID = "kartar-cup"
# Comma-separated list of exact origins allowed to call the proxy from a browser.
ALLOWED_ORIGINS = "https://kartar-cup.web.app,https://kartar-cup.firebaseapp.com"

# Secret (never committed):  npx wrangler secret put GOOGLE_PLACES_API_KEY

# Local development only: `npx wrangler dev --env dev` also allows the Vite dev server.
[env.dev.vars]
FIREBASE_PROJECT_ID = "kartar-cup"
ALLOWED_ORIGINS = "http://localhost:5173"
